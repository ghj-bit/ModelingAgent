    thinking_level: 'off'
    thinking_effective_behaviour: reasoning disabled at the provider API
    timeout_seconds: 7200
    invocation: openclaw.cmd agent --local --agent <id> --session-id <id> --message-file <prompt.md> --thinking
      <level> --timeout <s>
    session_transcripts: C:\Users\98263\.openclaw\agents\<agent>\sessions
  human_expert:
    role: Non-computational decision adviser; answers one qualitative question per exchange
    model_id: deepseek-v4-pro
    transport: direct OpenAI-compatible API call (no OpenClaw)
    temperature: 0.2
    max_tokens: 500
    thinking: 'disabled via extra_body={"thinking": {"type": "disabled"}}'
    timeout_seconds: 600.0
    max_attempts: 3
