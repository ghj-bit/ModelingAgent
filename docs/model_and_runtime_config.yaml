interaction_cost_model:
  formula: cost = exchange_weight*exchange_component + token_weight*token_component + latency_weight*latency_component
  exchange_component: (exchanges - 1) / (max_exchanges - 1)
  token_component: log1p(total_tokens) / log1p(total_token_reference)
  latency_component: log1p(total_latency) / log1p(total_latency_max_seconds)
  max_exchanges: 3
  total_token_reference: 5000
  exchange_weight: 0.5
  token_weight: 0.4
  latency_weight: 0.0
  penalty_weight_lambda: 0.05
  net_utility: mean_report_score - penalty
